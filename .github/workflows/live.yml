name: Live Tests

# End-to-end tests that run a real minimega deployment from a Docker image,
# boot a 22-VM KVM topology (tests/live/core/topology.mm), and exercise it over the
# command socket. See tests/live/README.md.
#
# Called by the Docker workflow: on master with the image it just pushed, on
# pull requests with no image, so this job builds the checked-out code from
# docker/Dockerfile and tests it in the same job. Run by hand (Actions > Live
# Tests > Run workflow, or `gh workflow run live.yml --ref <branch>`), it
# builds the dispatched branch the same way, so it works on a fork without a
# pull request. Set "image" to test an existing image instead.
#
# The android job runs the tests/live/android group the same way: one Android
# Emulator VM and one KVM router on a VLAN, with the SDK and the AVD installed
# on the runner and mounted into the container.

on:
  workflow_call:
    inputs:
      image:
        description: Image reference to test (empty builds the checked-out code)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image:
        description: Image to test, e.g. ghcr.io/sandia-minimega/minimega:master (empty builds this branch)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: read

jobs:
  live:
    name: Live tests (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ inputs.image || 'minimega:live' }}
      BUILD: ${{ inputs.image == '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the image build reads the version from git
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Free disk space
        run: |
          # the image, its guest build and 22 VMs need room; drop preinstalled
          # toolchains we do not use
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Check host support (KVM, Open vSwitch)
        run: |
          # GitHub-hosted Linux runners expose /dev/kvm; make it usable and
          # load the Open vSwitch datapath the container's ovs-ctl needs.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo modprobe openvswitch
          lsmod | grep -E '^(kvm|openvswitch)'
          nproc; free -h

      - name: Build container image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Use the local image
        if: env.BUILD == 'true'
        run: echo "LIVE_PULL=0" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: env.BUILD != 'true' && startsWith(env.IMAGE, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test binary
        run: go test -c -tags live -o "${{ runner.temp }}/live.test" ./tests/live/core

      - name: Run live tests
        run: |
          sudo --preserve-env=GITHUB_STEP_SUMMARY,LIVE_PULL \
            LIVE_TEST_BIN="${{ runner.temp }}/live.test" \
            LIVE_ARTIFACTS="${{ github.workspace }}/live-artifacts" \
            tests/live/run.sh "$IMAGE"

      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" live-artifacts || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-test-artifacts
          path: live-artifacts
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Live tests (Android)
    # pinned: the emulator is unmeasured on the image ubuntu-latest moves to next
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ${{ inputs.image || 'minimega:live' }}
      BUILD: ${{ inputs.image == '' }}
      # the runner's preinstalled SDK lives in sdk/; the AVD goes next to it.
      # tests/live/android/topology.mm uses the same paths.
      ANDROID_DIR: /usr/local/lib/android
      # the system image is the last word; the cache is keyed on this list
      SDK_PACKAGES: emulator platform-tools system-images;android-34;aosp_atd;x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the image build reads the version from git
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Free disk space
        run: |
          # unlike the KVM job, keep the Android SDK; drop only its NDK and CMake
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            "$ANDROID_DIR/sdk/ndk" "$ANDROID_DIR/sdk/cmake" || true
          df -h /

      - name: Check host support (KVM, Open vSwitch)
        run: |
          # GitHub-hosted Linux runners expose /dev/kvm; make it usable and
          # load the Open vSwitch datapath the container's ovs-ctl needs.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          sudo modprobe openvswitch
          lsmod | grep -E '^(kvm|openvswitch)'
          nproc; free -h

      - name: Build container image
        if: env.BUILD == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Log in to GitHub Container Registry
        if: env.BUILD != 'true' && startsWith(env.IMAGE, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        if: env.BUILD != 'true'
        run: docker pull -q "$IMAGE"

      - name: Android SDK cache key
        id: sdk
        run: |
          echo "key=android-sdk-${RUNNER_OS}-$(echo "$SDK_PACKAGES" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
          # the runner's preinstalled platform-tools belongs to root, and the
          # restore fails unless it can set the directory's mode and times
          sudo chown -R "$(id -u)" "$ANDROID_DIR/sdk/platform-tools"

      # restore and save are separate steps so that a failed test run still
      # leaves a cache behind
      - name: Restore Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_DIR }}/sdk/emulator
            ${{ env.ANDROID_DIR }}/sdk/platform-tools
            ${{ env.ANDROID_DIR }}/sdk/system-images
          key: ${{ steps.sdk.outputs.key }}

      - name: Install Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          start=$(date +%s)
          export ANDROID_HOME="$ANDROID_DIR/sdk" ANDROID_SDK_ROOT="$ANDROID_DIR/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          # the runner image ships neither the emulator nor any system image
          read -ra packages <<< "$SDK_PACKAGES"
          sdkmanager --install "${packages[@]}" >/dev/null
          echo "TIMING sdk_install=$(( $(date +%s) - start ))s (cache miss)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save Android SDK packages
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.ANDROID_DIR }}/sdk/emulator
            ${{ env.ANDROID_DIR }}/sdk/platform-tools
            ${{ env.ANDROID_DIR }}/sdk/system-images
          key: ${{ steps.sdk.outputs.key }}

      - name: Create the AVD
        run: |
          set -euo pipefail
          export ANDROID_HOME="$ANDROID_DIR/sdk" ANDROID_SDK_ROOT="$ANDROID_DIR/sdk"
          # avdmanager and the emulator disagree on the default AVD home on
          # 24.04 runners; minimega sets the same variable from android-avd-dir
          export ANDROID_AVD_HOME="$ANDROID_DIR/avd"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sudo mkdir -p "$ANDROID_AVD_HOME"
          sudo chown "$(id -u)" "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n mmtest --package "${SDK_PACKAGES##* }" --device 'Galaxy Nexus'
          # cores and memory match "vm config vcpus/memory" in topology.mm; a
          # small data partition keeps clear of the runner's disk limit
          printf 'hw.cpu.ncore=2\nhw.ramSize=2560\ndisk.dataPartition.size=2G\n' \
            >> "$ANDROID_AVD_HOME/mmtest.avd/config.ini"
          sdkmanager --list_installed
          df -h /

      - name: Preflight (can the image run the emulator?)
        run: |
          # ldd the emulator's binaries inside the image, with the library
          # path minimega sets, and ask the emulator whether it can use KVM.
          S="$ANDROID_DIR/sdk"
          pf() {
            docker run --rm -i --privileged -v /dev:/dev -v "$ANDROID_DIR:$ANDROID_DIR" \
              -e S="$S" -e ANDROID_SDK_ROOT="$S" \
              -e LD_LIBRARY_PATH="$S/emulator/lib:$S/emulator/lib64:$S/emulator/lib64/qt/lib" \
              "$1" bash -s <<'PREFLIGHT' || echo "MISSING preflight container failed"
          for b in "$S/emulator/emulator" "$S"/emulator/qemu/linux-x86_64/qemu-system-* "$S/platform-tools/adb"; do
            echo "== $b"
            [ -x "$b" ] || { echo "MISSING binary $b"; continue; }
            ldd "$b" 2>&1 | grep "not found"
          done
          "$S/emulator/emulator" -accel-check || echo "MISSING accel"
          PREFLIGHT
          }
          pf "$IMAGE" 2>&1 | tee preflight.txt
          RUN_IMAGE="$IMAGE"
          # ponytail: the image lacks libxkbfile1 until
          # https://github.com/sandia-minimega/minimega/pull/1724 adds it to
          # docker/Dockerfile; drop this fallback (and RUN_IMAGE) once it lands.
          if grep -Eq 'not found|MISSING' preflight.txt; then
            echo "::warning::the image cannot run the emulator as shipped (see preflight.txt); testing it with libxkbfile1 added"
            RUN_IMAGE=minimega:live-android
            printf 'FROM %s\nRUN apt-get update && apt-get install -y --no-install-recommends libxkbfile1\n' "$IMAGE" \
              | docker build -t "$RUN_IMAGE" -
            pf "$RUN_IMAGE" 2>&1 | tee preflight-patched.txt
            if grep -Eq 'not found|MISSING' preflight-patched.txt; then
              echo "::error::the image cannot run the emulator even with libxkbfile1 (see preflight-patched.txt)"
              exit 1
            fi
          fi
          echo "RUN_IMAGE=$RUN_IMAGE" >> "$GITHUB_ENV"

      - name: Build test binary
        run: go test -c -tags live -o "${{ runner.temp }}/live.test" ./tests/live/android

      - name: Run live tests
        run: |
          # the image is local by now, pulled or built (and maybe patched)
          sudo --preserve-env=GITHUB_STEP_SUMMARY \
            LIVE_PULL=0 \
            LIVE_GROUP=android \
            LIVE_DOCKER_ARGS="-v $ANDROID_DIR:$ANDROID_DIR" \
            LIVE_TEST_ARGS="-test.timeout 15m" \
            LIVE_TEST_BIN="${{ runner.temp }}/live.test" \
            LIVE_ARTIFACTS="${{ github.workspace }}/live-artifacts" \
            tests/live/run.sh "$RUN_IMAGE"

      - name: Boot timings
        if: always()
        run: |
          {
            echo '### Android timings'
            echo '```'
            grep -h TIMING live-artifacts/live-test.log || echo "no TIMING lines in live-test.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fix artifact permissions
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" live-artifacts || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-test-artifacts-android
          # logs/minimega.log, android-emulator-*.log, logcat.txt, live-test.log
          path: |
            live-artifacts
            preflight*.txt
          retention-days: 14
          if-no-files-found: warn
